[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lyrebird-groundstation"
version = "0.1.0"
description = "Shared Python client for the Lyrebird drone ground station"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.scripts]
lyrebird-mavlink-listen = "lyrebird_groundstation.mavlink_listen:main"

[tool.setuptools]
# The loose modules keep their historical import paths (djiInterfaceSafety,
# lyrebird_dji_helpers) so existing callers and scripts keep working after
# a plain pip install, without PYTHONPATH tricks.
packages = ["lyrebird_groundstation"]
py-modules = ["djiInterfaceSafety", "lyrebird_dji_helpers"]
