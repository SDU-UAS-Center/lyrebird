# Pre-commit hooks for GroundStation Python and Lyrebird-owned Android quality.
# Install locally: pre-commit install
# Run manually:    pre-commit run --all-files
# Run tests:       pre-commit run groundstation-tests android-tests --hook-stage manual
# Bypass checks:   git commit --no-verify (use sparingly)
#
# Keep these hooks in lockstep with .github/workflows/ci.yml. CI runs the same
# default-stage checks plus GroundStation pytest and Android compile/unit tests
# on every pull request and push to main.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.14"
    hooks:
      - id: ruff
        name: ruff lint - GroundStation Python
        args: [--fix]
        files: ^GroundStation/.*\.py$
      - id: ruff-format
        name: ruff format - GroundStation Python
        files: ^GroundStation/.*\.py$

  - repo: local
    hooks:
      - id: radon-complexity
        name: radon complexity - require B-or-better GroundStation blocks
        entry: python scripts/check_radon_complexity.py
        language: python
        additional_dependencies: [radon==6.0.1]
        pass_filenames: false
        files: ^GroundStation/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v2.1.0"
    hooks:
      - id: mypy
        name: mypy - GroundStation gradual typing
        additional_dependencies:
          - types-requests
        pass_filenames: false
        files: ^GroundStation/.*\.py$

  - repo: https://github.com/PyCQA/bandit
    rev: "1.9.4"
    hooks:
      - id: bandit
        name: bandit - GroundStation security scan
        args: [-r, GroundStation, -ll, --skip, B101]
        pass_filenames: false
        files: ^GroundStation/.*\.py$

  - repo: local
    hooks:
      - id: groundstation-tests
        name: GroundStation Python tests
        entry: python -m pytest GroundStation/tests -q
        language: python
        additional_dependencies:
          - pytest
          - pymavlink==2.4.43
          - requests>=2.28
        pass_filenames: false
        stages: [manual]
        files: ^GroundStation/.*\.py$

      - id: android-spotless
        name: android spotless - Lyrebird-owned Kotlin format
        entry: bash -c 'cd LyrebirdApp/android-sdk-v5-as && ./gradlew --quiet :app:spotlessKotlinCheck'
        language: system
        pass_filenames: false
        files: ^LyrebirdApp/lyrebird-app/.*\.kt$
      - id: android-tests
        name: android tests - compile + unit tests
        entry: bash -c 'cd LyrebirdApp/android-sdk-v5-as && ./gradlew --quiet :app:compileCurrentDebugKotlin :app:testCurrentDebugUnitTest'
        language: system
        pass_filenames: false
        stages: [manual]
        files: ^LyrebirdApp/lyrebird-app/.*\.kt$